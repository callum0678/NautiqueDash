<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly the Nautique Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(22, 24, 30, 0.95);
            --card-bg: #1c1e24;
            --nautique-orange: #ff5500;
            --orange-glow: rgba(255, 85, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --danger-red: #ff3b30;
            --connected-green: #00ff66;
        }

        body { 
            font-family: 'Inter', Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 15px; 
            margin: 0;
            background-image: radial-gradient(circle at top, #1e1b18 0%, var(--bg-color) 70%);
            touch-action: manipulation;
        }

        .dashboard { 
            max-width: 480px; 
            margin: 10px auto; 
            background: var(--panel-bg); 
            padding: 25px 20px; 
            border-radius: 32px; 
            border: 1px solid rgba(255, 85, 0, 0.2); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 85, 0, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem; 
            margin: 0 0 2px 0; 
            font-weight: 900; 
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { 
            color: var(--nautique-orange); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            text-shadow: 0 0 10px var(--orange-glow);
        }

        .last-updated-header {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .bt-connection-bar {
            margin-bottom: 20px;
        }

        .btn-connect {
            background: linear-gradient(135deg, #ff5500 0%, #d44400 100%);
            color: #ffffff;
            width: 100%;
            padding: 12px;
            font-size: 0.85rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-connect.connected {
            background: #1c1e24;
            color: var(--connected-green);
            border: 1px solid var(--connected-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .speed-gauge-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 25px auto;
        }

        .speed-svg { transform: rotate(-90deg); }
        .speed-track { fill: none; stroke: #17191f; stroke-width: 14; }
        .speed-bar {
            fill: none;
            stroke: var(--nautique-orange);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 8px var(--nautique-orange));
        }

        .speed-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .speed-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
        }

        .speed-unit {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        #map-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 85, 0, 0.2);
            text-align: left;
        }

        #map-title {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        #map {
            width: 100%;
            height: 240px;
            border-radius: 14px;
            background: #121317;
            z-index: 1;
        }

        /* Dark map style filter */
        .dark-tiles {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .grid-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 10px 0;
            padding: 0 5px;
        }

        .section-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .btn-edit {
            background: var(--nautique-orange);
            color: #ffffff;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 85, 0, 0.2);
            transition: all 0.2s ease;
        }
        .btn-edit.active {
            background: #ffffff;
            color: var(--bg-color);
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-bottom: 25px;
            min-height: 50px;
        }

        .gauge-card { 
            background: var(--card-bg); 
            padding: 16px 12px; 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
            text-align: left;
            position: relative;
            overflow: hidden;
            user-select: none;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .card-label { 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-val { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem; 
            font-weight: 700; 
            color: var(--text-main); 
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: #121317;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--nautique-orange);
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 6px var(--nautique-orange);
            transition: width 0.3s ease;
        }

        .edit-mode .gauge-card {
            border: 1px dashed var(--nautique-orange);
            cursor: move;
            animation: gentleWobble 0.3s infinite alternate;
        }

        .card-delete-btn {
            display: none;
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: var(--danger-red);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            z-index: 10;
        }
        .edit-mode .card-delete-btn { display: block; }

        @keyframes gentleWobble {
            0% { transform: rotate(-0.5deg); }
            100% { transform: rotate(0.5deg); }
        }

        .add-item-panel {
            display: none;
            background: #121317;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        .add-item-panel select {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid #2c2f36;
            color: white;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }

        .control-panel { 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            text-align: left; 
        }

        .flex-group { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; align-items: center; }
        
        input[type="number"] { 
            padding: 14px; 
            font-size: 1rem; 
            flex-grow: 1; 
            border-radius: 14px; 
            border: 1px solid #2c2f36; 
            background: #121317; 
            color: #ffffff; 
            font-weight: 600;
            text-align: center; 
            outline: none;
        }

        button { 
            padding: 14px 20px; 
            font-size: 0.95rem; 
            border: none; 
            border-radius: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-orange { 
            background: var(--nautique-orange); 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
        }
        
        #gps-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        /* --- JOURNEY LOG STYLES --- */
        .journey-logs-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }

        .journey-day-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .journey-day-card.active {
            border-color: rgba(255, 85, 0, 0.4);
        }

        .journey-day-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .day-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .day-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .day-meta {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .day-fuel-pill {
            background: rgba(255, 85, 0, 0.15);
            color: var(--nautique-orange);
            font-size: 0.78rem;
            font-weight: 800;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 85, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-arrow {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
            color: var(--text-muted);
        }

        .journey-day-card.active .toggle-arrow {
            transform: rotate(180deg);
            color: var(--nautique-orange);
        }

        .journey-day-content {
            display: none;
            padding: 0 16px 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            background: rgba(18, 19, 23, 0.5);
        }

        .day-map-container {
            width: 100%;
            height: 200px;
            border-radius: 12px;
            margin-top: 12px;
            background: #121317;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Nelly the Nautique</h1>
        <div class="subtitle">Multi-Telemetry Hub</div>
        <div class="last-updated-header" id="last-updated-text">Last updated: --</div>

        <div class="bt-connection-bar">
            <button id="bt-btn" class="btn-connect" onclick="toggleBluetoothConnection()">Pair Bluetooth Device</button>
        </div>
        
        <div id="gps-status">GPS: DISCONNECTED</div>

        <div class="speed-gauge-container">
            <svg class="speed-svg" width="220" height="220">
                <circle class="speed-track" cx="110" cy="110" r="90"></circle>
                <circle id="speed-ring" class="speed-bar" cx="110" cy="110" r="90"></circle>
            </svg>
            <div class="speed-text-container">
                <span id="speed-val" class="speed-value">0</span>
                <span class="speed-unit">MPH</span>
            </div>
        </div>

        <!-- Live Map Section -->
        <div id="map-card">
            <div id="map-title">Live Journey Map & GPS Track</div>
            <div id="map"></div>
        </div>

        <div class="grid-header-row">
            <div class="section-label">Instruments</div>
            <button class="btn-edit" id="edit-layout-btn" onclick="toggleEditMode()">Edit</button>
        </div>

        <div class="add-item-panel" id="add-item-box">
            <div class="card-label">Add Instrument Option</div>
            <select id="gauge-selector"></select>
            <button class="btn-orange" style="padding: 10px; font-size:0.8rem; width:100%;" onclick="addGaugeNode()">Insert Into Grid</button>
        </div>

        <div class="grid-container" id="telemetry-grid"></div>

        <div class="control-panel">
            <div class="card-label" style="padding-left:4px;">Log Top-Off Fuel (Liters)</div>
            <div class="flex-group">
                <input type="number" id="refill-input" step="0.1" placeholder="Liters on receipt">
                <button type="button" class="btn-orange" onclick="sendRefillCommand()">Reset Full</button>
            </div>
        </div>

        <!-- Historical Daily Journey Logs -->
        <div class="journey-logs-section">
            <div class="section-label" style="margin-bottom: 12px;">Daily Journey Logs</div>
            <div id="journey-logs-container">
                <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 15px;">Loading journey records...</div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://cgssprxbklhkoscvclux.supabase.co/";       
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc3Nwcnhia2xoa29zY3ZjbHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTYyNzMsImV4cCI6MjEwMDgzMjI3M30.Bua2rEmjUkW-ZUJjAOyxFk95dXgQFxJNMG5CwbDffdc";  
        const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL") ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // --- 2. INDEXED DB OFFLINE SYNC SETUP ---
        let db;
        const dbReq = indexedDB.open("NautiqueOfflineQueue", 1);
        dbReq.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("logs")) {
                db.createObjectStore("logs", { autoIncrement: true });
            }
        };
        dbReq.onsuccess = (e) => {
            db = e.target.result;
            attemptOfflineSync();
        };

        function queueOfflineLog(payload) {
            if (!db) return;
            const tx = db.transaction("logs", "readwrite");
            tx.objectStore("logs").add(payload);
        }

        async function attemptOfflineSync() {
            if (!navigator.onLine || !supabase || !db) return;
            const tx = db.transaction("logs", "readonly");
            const store = tx.objectStore("logs");
            const getAllReq = store.getAll();

            getAllReq.onsuccess = async () => {
                const pendingLogs = getAllReq.result;
                if (pendingLogs.length > 0) {
                    const { error } = await supabase.from('telemetry_logs').insert(pendingLogs);
                    if (!error) {
                        const clearTx = db.transaction("logs", "readwrite");
                        clearTx.objectStore("logs").clear();
                        console.log(`Synced ${pendingLogs.length} offline records to Supabase.`);
                        loadHistoricalJourney();
                    }
                }
            };
        }

        window.addEventListener('online', attemptOfflineSync);

        // --- 3. BLE & MAP SETUP ---
        const NUS_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const NUS_TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        const GAUGE_REGISTRY = {
            "fuel_mgmt":        { name: "Fuel Level",     unit: " L",    hasProgress: true,  isDefault: true },
            "engine_rpm":       { name: "Engine Speed",   unit: " RPM",  hasProgress: true,  isDefault: true },
            "throttle_percent": { name: "Throttle",       unit: "%",     hasProgress: true,  isDefault: true },
            "run_time_seconds": { name: "Run Time",       unit: "",      hasProgress: false, isDefault: true },
            "coolant_temp":     { name: "Coolant Temp",   unit: " °C",   hasProgress: false, isDefault: false },
            "oil_pressure":     { name: "Engine Oil Press",unit: " kPa",  hasProgress: false, isDefault: false },
            "battery_volt":     { name: "Battery Voltage",unit: " V",    hasProgress: false, isDefault: false },
            "engine_hours":     { name: "Engine Hours",   unit: " hrs",  hasProgress: false, isDefault: false },
            "intake_temp":      { name: "Intake Air Temp",unit: " °C",   hasProgress: false, isDefault: false },
            "fuel_rate":        { name: "Fuel Rate",      unit: " L/h",  hasProgress: false, isDefault: false },
            "j1939_fuel_level": { name: "Fuel Level (J)", unit: " %",    hasProgress: true,  isDefault: false },
            "zo_handshake":     { name: "ZeroOff Sync",   unit: "",      hasProgress: false, isDefault: false },
            "security_heart":   { name: "Security Auth",  unit: "",      hasProgress: false, isDefault: false },
            "zo_speed":         { name: "ZeroOff SOG",    unit: " mph",  hasProgress: false, isDefault: false }
        };

        let activeLayout = [];
        let isEditing = false;
        const circumference = 2 * Math.PI * 90;

        let bleDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let isConnected = false;
        let receiveBuffer = "";

        // Map Variables
        let map, routePolyline, boatMarker;
        let routeCoordinates = [];
        let lastDatabaseSaveTime = 0;
        let dayMapInstances = {};

        function initMap() {
            map = L.map('map').setView([54.3742, -7.6802], 12);
            
            // Using direct HTTPS OpenStreetMap tiles with dark CSS layer
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                className: 'dark-tiles',
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            routePolyline = L.polyline([], {
                color: '#ff5500',
                weight: 5,
                opacity: 0.9,
                lineJoin: 'round'
            }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // --- 4. HISTORICAL JOURNEY LOGS & AGGREGATION ---
        const MOCK_JOURNEY_DATA = [
            { created_at: "2026-07-28T10:15:00Z", latitude: 54.3481, longitude: -7.6410, fuel_liters: 72.0 },
            { created_at: "2026-07-28T11:45:00Z", latitude: 54.3565, longitude: -7.6521, fuel_liters: 66.5 },
            { created_at: "2026-07-28T14:20:00Z", latitude: 54.3742, longitude: -7.6802, fuel_liters: 58.0 },
            { created_at: "2026-07-27T09:30:00Z", latitude: 54.3810, longitude: -7.6895, fuel_liters: 80.0 },
            { created_at: "2026-07-27T16:00:00Z", latitude: 54.4051, longitude: -7.7380, fuel_liters: 68.2 }
        ];

        async function loadHistoricalJourney() {
            let data = MOCK_JOURNEY_DATA;

            if (supabase) {
                const { data: dbData, error } = await supabase
                    .from('telemetry_logs')
                    .select('*')
                    .order('created_at', { ascending: true })
                    .limit(1000);

                if (!error && dbData && dbData.length > 0) {
                    data = dbData;
                }
            }

            // Render live polyline on master map
            routeCoordinates = data
                .filter(row => row.latitude && row.longitude)
                .map(row => [row.latitude, row.longitude]);

            if (routeCoordinates.length > 0) {
                routePolyline.setLatLngs(routeCoordinates);
                map.fitBounds(routePolyline.getBounds(), { padding: [20, 20] });

                const lastRow = data[data.length - 1];
                updateLastUpdatedTimestamp(new Date(lastRow.created_at));
            }

            renderDailyJourneyLogs(data);
        }

        function renderDailyJourneyLogs(logs) {
            const container = document.getElementById('journey-logs-container');
            if (!logs || logs.length === 0) {
                container.innerHTML = '<div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 15px;">No journey records found.</div>';
                return;
            }

            // Group by Date (YYYY-MM-DD)
            const grouped = {};
            logs.forEach(log => {
                const dateKey = new Date(log.created_at).toISOString().split('T')[0];
                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push(log);
            });

            // Sort dates descending
            const sortedDates = Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a));

            container.innerHTML = sortedDates.map((dateKey, index) => {
                const dayLogs = grouped[dateKey];
                const tripsCount = dayLogs.length;

                // Calculate total fuel used in the day
                const fuelStart = dayLogs[0].fuel_liters || 0;
                const fuelEnd = dayLogs[dayLogs.length - 1].fuel_liters || 0;
                const fuelUsed = Math.max(0, (fuelStart - fuelEnd)).toFixed(1);

                const formattedDate = new Date(dateKey).toLocaleDateString('en-GB', {
                    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
                });

                return `
                    <div class="journey-day-card" id="day-card-${index}">
                        <div class="journey-day-header" onclick="toggleDayAccordion(${index}, '${dateKey}')">
                            <div class="day-info">
                                <div class="day-date">${formattedDate}</div>
                                <div class="day-meta">${tripsCount} ${tripsCount === 1 ? 'trip' : 'trips aggregated'}</div>
                            </div>
                            <div class="day-fuel-pill">
                                <span>${fuelUsed > 0 ? fuelUsed + ' L Used' : 'Minimal Fuel'}</span>
                                <span class="toggle-arrow">▼</span>
                            </div>
                        </div>
                        <div class="journey-day-content" id="day-content-${index}">
                            <div class="day-map-container" id="day-map-${index}"></div>
                        </div>
                    </div>
                `;
            }).join('');

            // Store grouped coordinates globally for map rendering
            window.dailyLogsGrouped = grouped;
            window.sortedDates = sortedDates;
        }

        function toggleDayAccordion(index, dateKey) {
            const card = document.getElementById(`day-card-${index}`);
            const content = document.getElementById(`day-content-${index}`);
            const isOpen = card.classList.contains('active');

            if (isOpen) {
                card.classList.remove('active');
                content.style.display = 'none';
            } else {
                card.classList.add('active');
                content.style.display = 'block';

                // Initialize nested Leaflet map lazily when opened
                setTimeout(() => {
                    if (!dayMapInstances[index]) {
                        const dayMap = L.map(`day-map-${index}`).setView([54.3742, -7.6802], 12);
                        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            maxZoom: 19,
                            className: 'dark-tiles',
                            attribution: '&copy; OpenStreetMap'
                        }).addTo(dayMap);

                        const dayLogs = window.dailyLogsGrouped[dateKey];
                        const coords = dayLogs
                            .filter(l => l.latitude && l.longitude)
                            .map(l => [l.latitude, l.longitude]);

                        if (coords.length > 0) {
                            const polyline = L.polyline(coords, {
                                color: '#ff5500',
                                weight: 4,
                                opacity: 0.95
                            }).addTo(dayMap);
                            dayMap.fitBounds(polyline.getBounds(), { padding: [15, 15] });
                        }
                        dayMapInstances[index] = dayMap;
                    } else {
                        dayMapInstances[index].invalidateSize();
                    }
                }, 100);
            }
        }

        function updateLastUpdatedTimestamp(dateObj) {
            const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = dateObj.toLocaleDateString('en-GB');
            document.getElementById('last-updated-text').innerText = `Last updated at ${timeStr} ${dateStr}`;
        }

        function initLayoutConfig() {
            let stored = localStorage.getItem('nautique_layout_v2');
            if (stored) {
                activeLayout = JSON.parse(stored);
            } else {
                activeLayout = Object.keys(GAUGE_REGISTRY).filter(k => GAUGE_REGISTRY[k].isDefault);
                saveLayoutConfig();
            }
        }

        function saveLayoutConfig() {
            localStorage.setItem('nautique_layout_v2', JSON.stringify(activeLayout));
        }

        function renderGaugeGrid() {
            const grid = document.getElementById('telemetry-grid');
            grid.innerHTML = '';

            activeLayout.forEach(key => {
                const meta = GAUGE_REGISTRY[key];
                if (!meta) return;

                const card = document.createElement('div');
                card.className = 'gauge-card';
                card.setAttribute('draggable', isEditing ? 'true' : 'false');
                card.setAttribute('data-key', key);

                let progressHtml = meta.hasProgress ? `
                    <div class="progress-track" style="margin-top:6px;">
                        <div id="pb-${key}" class="progress-bar" style="width: 0%"></div>
                    </div>` : '';

                let subLabel = "Telemetry Data";
                if(key === 'fuel_mgmt') subLabel = "-- / 80 L";
                if(key === 'engine_rpm') subLabel = "Tachometer";
                if(key === 'throttle_percent') subLabel = "Position Index";
                if(key === 'run_time_seconds') subLabel = "Active Hours";

                card.innerHTML = `
                    <div class="card-label">${meta.name}</div>
                    <div id="val-${key}" class="card-val">--</div>
                    <div id="sub-${key}" style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px;">${subLabel}</div>
                    ${progressHtml}
                    <button class="card-delete-btn" onclick="deleteGaugeNode(event, '${key}')">Delete</button>
                `;
                grid.appendChild(card);
            });

            const selector = document.getElementById('gauge-selector');
            selector.innerHTML = '';
            Object.keys(GAUGE_REGISTRY).forEach(key => {
                if (!activeLayout.includes(key)) {
                    selector.innerHTML += `<option value="${key}">${GAUGE_REGISTRY[key].name}</option>`;
                }
            });
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            const btn = document.getElementById('edit-layout-btn');
            const grid = document.getElementById('telemetry-grid');
            const addPanel = document.getElementById('add-item-box');

            if (isEditing) {
                btn.innerText = "Done";
                btn.classList.add('active');
                grid.classList.add('edit-mode');
                addPanel.style.display = 'block';
            } else {
                btn.innerText = "Edit";
                btn.classList.remove('active');
                grid.classList.remove('edit-mode');
                addPanel.style.display = 'none';
                saveLayoutConfig();
            }
        }

        function addGaugeNode() {
            const selector = document.getElementById('gauge-selector');
            if (selector.value) {
                activeLayout.push(selector.value);
                renderGaugeGrid();
                saveLayoutConfig();
            }
        }

        function deleteGaugeNode(e, key) {
            e.stopPropagation();
            activeLayout = activeLayout.filter(k => k !== key);
            renderGaugeGrid();
            saveLayoutConfig();
        }

        // --- BLE HANDLER ---
        async function toggleBluetoothConnection() {
            if (isConnected) {
                disconnectBluetooth();
                return;
            }

            try {
                if (!('bluetooth' in navigator)) {
                    alert('Web Bluetooth API is not supported. Use Bluefy browser on iOS or Chrome on Android.');
                    return;
                }

                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Nautique-Telemetry' }],
                    optionalServices: [NUS_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(NUS_SERVICE_UUID);

                rxCharacteristic = await service.getCharacteristic(NUS_RX_UUID);
                txCharacteristic = await service.getCharacteristic(NUS_TX_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

                isConnected = true;
                const btBtn = document.getElementById('bt-btn');
                btBtn.innerText = "BLE Connected";
                btBtn.classList.add('connected');
            } catch (err) {
                console.error("BLE Connection Error:", err);
            }
        }

        function onDisconnected() {
            isConnected = false;
            const btBtn = document.getElementById('bt-btn');
            btBtn.innerText = "Pair Bluetooth Device";
            btBtn.classList.remove('connected');

            document.getElementById('gps-status').innerText = "GPS: DISCONNECTED";
            document.getElementById('gps-status').style.color = "var(--text-muted)";
        }

        function disconnectBluetooth() {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
            }
            onDisconnected();
        }

        function handleBLEData(event) {
            let decoder = new TextDecoder('utf-8');
            receiveBuffer += decoder.decode(event.target.value);

            let lines = receiveBuffer.split('\n');
            receiveBuffer = lines.pop();

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('{') && line.endsWith('}')) {
                    try {
                        const data = JSON.parse(line);
                        updateDashboard(data);
                        processDatabaseSync(data);
                    } catch (e) { console.error("JSON Error", e); }
                }
            });
        }

        function updateDashboard(data) {
            const speedValEl = document.getElementById('speed-val');
            const speedRing = document.getElementById('speed-ring');
            const gpsStatus = document.getElementById('gps-status');

            if (data.gps_valid) {
                gpsStatus.innerText = "GPS: LOCKED (GARMIN)";
                gpsStatus.style.color = "#00ff66";
                let mph = data.gps_speed || 0;
                speedValEl.innerText = Math.round(mph);
                let speedPercent = Math.min(mph / 50, 1);
                speedRing.style.strokeDashoffset = circumference - (speedPercent * circumference);

                // Update Map Position
                if (data.gps_lat && data.gps_lng && data.gps_lat !== 0) {
                    const latLng = [data.gps_lat, data.gps_lng];
                    routeCoordinates.push(latLng);
                    routePolyline.setLatLngs(routeCoordinates);

                    if (!boatMarker) {
                        boatMarker = L.circleMarker(latLng, { color: '#ff5500', fillColor: '#ff5500', fillOpacity: 1, radius: 7 }).addTo(map);
                        map.setView(latLng, 15);
                    } else {
                        boatMarker.setLatLng(latLng);
                    }
                }
            } else {
                gpsStatus.innerText = "GPS: SEARCHING...";
                gpsStatus.style.color = "#ff8800";
                speedValEl.innerText = "0";
                speedRing.style.strokeDashoffset = circumference;
            }

            activeLayout.forEach(key => {
                const valEl = document.getElementById(`val-${key}`);
                const pbEl = document.getElementById(`pb-${key}`);
                const subEl = document.getElementById(`sub-${key}`);
                if (!valEl) return;

                let value = data[key];
                let unit = GAUGE_REGISTRY[key].unit;

                if (value === undefined || value === null) {
                    valEl.innerText = "--";
                    return;
                }

                if (key === 'fuel_mgmt') {
                    valEl.innerText = data.fuel_percent + '%';
                    if(subEl) subEl.innerText = data.fuel_liters + ' / 80 L';
                    if(pbEl) pbEl.style.width = data.fuel_percent + '%';
                } else if (key === 'run_time_seconds') {
                    valEl.innerText = data.runtime;
                } else {
                    valEl.innerText = value + unit;
                    if (pbEl) {
                        let pct = 0;
                        if (key === 'engine_rpm') pct = Math.min((value / 6000) * 100, 100);
                        else if (key === 'throttle_percent' || key === 'j1939_fuel_level') pct = value;
                        pbEl.style.width = pct + '%';
                    }
                }
            });

            updateLastUpdatedTimestamp(new Date());
        }

        async function processDatabaseSync(data) {
            const now = Date.now();
            if (now - lastDatabaseSaveTime < 5000) return;
            lastDatabaseSaveTime = now;

            const record = {
                latitude: data.gps_lat || null,
                longitude: data.gps_lng || null,
                fuel_liters: data.fuel_liters,
                fuel_percent: data.fuel_percent,
                engine_rpm: data.engine_rpm,
                throttle_percent: data.throttle_percent,
                coolant_temp: data.coolant_temp,
                oil_pressure: data.oil_pressure,
                battery_volt: data.battery_volt,
                engine_hours: data.engine_hours,
                gps_speed: data.gps_speed,
                trip_seconds: data.run_time_seconds
            };

            if (navigator.onLine && supabase) {
                const { error } = await supabase.from('telemetry_logs').insert([record]);
                if (error) {
                    console.warn("Supabase insert failed, queueing offline:", error);
                    queueOfflineLog(record);
                }
            } else {
                queueOfflineLog(record);
            }
        }

        async function sendRefillCommand() {
            const input = document.getElementById('refill-input');
            const liters = parseFloat(input.value);

            if (isNaN(liters) || liters <= 0) {
                alert("Please enter a valid number of liters.");
                return;
            }

            if (!isConnected || !rxCharacteristic) {
                alert("Bluetooth is not connected.");
                return;
            }

            const encoder = new TextEncoder();
            await rxCharacteristic.writeValue(encoder.encode(`REFILL:${liters}\n`));
            input.value = '';
            alert(`Sent Refill Command: ${liters} L`);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            initLayoutConfig();
            renderGaugeGrid();
            loadHistoricalJourney();
        });
    </script>
</body>
