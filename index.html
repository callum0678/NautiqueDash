<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly the Nautique Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(22, 24, 30, 0.95);
            --card-bg: #1c1e24;
            --nautique-orange: #ff5500;
            --orange-glow: rgba(255, 85, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --danger-red: #ff3b30;
            --connected-green: #00ff66;
        }

        body { 
            font-family: 'Inter', Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 15px; 
            margin: 0;
            background-image: radial-gradient(circle at top, #1e1b18 0%, var(--bg-color) 70%);
            touch-action: manipulation;
        }

        .dashboard { 
            max-width: 480px; 
            margin: 10px auto; 
            background: var(--panel-bg); 
            padding: 25px 20px; 
            border-radius: 32px; 
            border: 1px solid rgba(255, 85, 0, 0.2); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 85, 0, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem; 
            margin: 0 0 2px 0; 
            font-weight: 900; 
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { 
            color: var(--nautique-orange); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            text-shadow: 0 0 10px var(--orange-glow);
        }

        .last-updated-header {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .bt-connection-bar {
            margin-bottom: 20px;
        }

        .btn-connect {
            background: linear-gradient(135deg, #ff5500 0%, #d44400 100%);
            color: #ffffff;
            width: 100%;
            padding: 12px;
            font-size: 0.85rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-connect.connected {
            background: #1c1e24;
            color: var(--connected-green);
            border: 1px solid var(--connected-green);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        .speed-gauge-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 25px auto;
        }

        .speed-svg { transform: rotate(-90deg); }
        .speed-track { fill: none; stroke: #17191f; stroke-width: 14; }
        .speed-bar {
            fill: none;
            stroke: var(--nautique-orange);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 8px var(--nautique-orange));
        }

        .speed-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .speed-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
        }

        .speed-unit {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        #map-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 85, 0, 0.2);
            text-align: left;
        }

        #map-title {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        #map {
            width: 100%;
            height: 240px;
            border-radius: 14px;
            background: #121317;
            z-index: 1;
        }

        /* Dark Mode Tile Inversion Filter for OSM */
        .dark-tiles {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .grid-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 10px 0;
            padding: 0 5px;
        }

        .section-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .btn-edit {
            background: var(--nautique-orange);
            color: #ffffff;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 85, 0, 0.2);
            transition: all 0.2s ease;
        }
        .btn-edit.active {
            background: #ffffff;
            color: var(--bg-color);
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-bottom: 25px;
            min-height: 50px;
        }

        .gauge-card { 
            background: var(--card-bg); 
            padding: 16px 12px; 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
            text-align: left;
            position: relative;
            overflow: hidden;
            user-select: none;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }

        .card-label { 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-val { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem; 
            font-weight: 700; 
            color: var(--text-main); 
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: #121317;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--nautique-orange);
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 6px var(--nautique-orange);
            transition: width 0.3s ease;
        }

        .edit-mode .gauge-card {
            border: 1px dashed var(--nautique-orange);
            cursor: move;
            animation: gentleWobble 0.3s infinite alternate;
        }

        .card-delete-btn {
            display: none;
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: var(--danger-red);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 0.65rem;
            font-weight: 800;
            cursor: pointer;
            z-index: 10;
        }
        .edit-mode .card-delete-btn { display: block; }

        @keyframes gentleWobble {
            0% { transform: rotate(-0.5deg); }
            100% { transform: rotate(0.5deg); }
        }

        .add-item-panel {
            display: none;
            background: #121317;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: left;
        }
        .add-item-panel select {
            width: 100%;
            padding: 12px;
            background: var(--card-bg);
            border: 1px solid #2c2f36;
            color: white;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 10px;
            outline: none;
        }

        /* JOURNEY LOGS STYLES */
        .journey-section {
            margin-top: 30px;
            text-align: left;
        }

        .day-log-card {
            background: var(--card-bg);
            border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
            overflow: hidden;
        }

        .day-log-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.02);
            transition: background 0.2s;
        }

        .day-log-header:hover {
            background: rgba(255, 85, 0, 0.05);
        }

        .day-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .day-summary {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .day-total-fuel {
            color: var(--nautique-orange);
            font-weight: 800;
        }

        .toggle-arrow {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .day-log-card.open .toggle-arrow {
            transform: rotate(180deg);
            color: var(--nautique-orange);
        }

        .day-log-details {
            display: none;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
            background: #121317;
        }

        .day-log-card.open .day-log-details {
            display: block;
        }

        .sub-journey-item {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .sub-journey-item:last-child {
            margin-bottom: 0;
        }

        .sub-journey-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .sub-journey-stats {
            display: flex;
            gap: 12px;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .sub-journey-stats span {
            color: var(--text-main);
            font-weight: 600;
        }

        .mini-map {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            background: #0d0e12;
            z-index: 1;
        }

        .control-panel { 
            margin-top: 25px; 
            padding-top: 20px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            text-align: left; 
        }

        .flex-group { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; align-items: center; }
        
        input[type="number"] { 
            padding: 14px; 
            font-size: 1rem; 
            flex-grow: 1; 
            border-radius: 14px; 
            border: 1px solid #2c2f36; 
            background: #121317; 
            color: #ffffff; 
            font-weight: 600;
            text-align: center; 
            outline: none;
        }

        button { 
            padding: 14px 20px; 
            font-size: 0.95rem; 
            border: none; 
            border-radius: 14px; 
            font-weight: 800; 
            cursor: pointer; 
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-orange { 
            background: var(--nautique-orange); 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
        }
        
        #gps-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Nelly the Nautique</h1>
        <div class="subtitle">Multi-Telemetry Hub</div>
        <div class="last-updated-header" id="last-updated-text">Last updated at 12:32 28/07/2026</div>

        <div class="bt-connection-bar">
            <button id="bt-btn" class="btn-connect" onclick="toggleBluetoothConnection()">Pair Bluetooth Device</button>
        </div>
        
        <div id="gps-status" style="color:#00ff66;">GPS: LOCKED (GARMIN)</div>

        <div class="speed-gauge-container">
            <svg class="speed-svg" width="220" height="220">
                <circle class="speed-track" cx="110" cy="110" r="90"></circle>
                <circle id="speed-ring" class="speed-bar" cx="110" cy="110" r="90"></circle>
            </svg>
            <div class="speed-text-container">
                <span id="speed-val" class="speed-value">22</span>
                <span class="speed-unit">MPH</span>
            </div>
        </div>

        <!-- Main Live Map Section -->
        <div id="map-card">
            <div id="map-title">Live Journey Map & GPS Track (Lough Erne)</div>
            <div id="map"></div>
        </div>

        <div class="grid-header-row">
            <div class="section-label">Instruments</div>
            <button class="btn-edit" id="edit-layout-btn" onclick="toggleEditMode()">Edit</button>
        </div>

        <div class="add-item-panel" id="add-item-box">
            <div class="card-label">Add Instrument Option</div>
            <select id="gauge-selector"></select>
            <button class="btn-orange" style="padding: 10px; font-size:0.8rem; width:100%;" onclick="addGaugeNode()">Insert Into Grid</button>
        </div>

        <div class="grid-container" id="telemetry-grid"></div>

        <!-- Journey Logs Section -->
        <div class="journey-section">
            <div class="grid-header-row" style="margin-top:0;">
                <div class="section-label">Journey Logs History</div>
            </div>
            <div id="journey-logs-container"></div>
        </div>

        <div class="control-panel">
            <div class="card-label" style="padding-left:4px;">Log Top-Off Fuel (Liters)</div>
            <div class="flex-group">
                <input type="number" id="refill-input" step="0.1" placeholder="Liters on receipt">
                <button type="button" class="btn-orange" onclick="sendRefillCommand()">Reset Full</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "YOUR_SUPABASE_URL";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
        const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL") ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // --- 2. SAMPLE JOURNEY DATA ---
        const SAMPLE_LOUGH_ERNE_TRACK = [
            [54.3481, -7.6410], [54.3512, -7.6452], [54.3565, -7.6521], [54.3620, -7.6605],
            [54.3685, -7.6710], [54.3742, -7.6802], [54.3810, -7.6895], [54.3882, -7.7011],
            [54.3945, -7.7120], [54.3998, -7.7245], [54.4051, -7.7380], [54.4120, -7.7510],
            [54.4195, -7.7650], [54.4180, -7.7610], [54.4105, -7.7480], [54.4020, -7.7300],
            [54.3920, -7.7080], [54.3820, -7.6910], [54.3660, -7.6680], [54.3490, -7.6420]
        ];

        // Sample Historical Journeys (grouped by day)
        const SAMPLE_JOURNEY_LOGS = [
            {
                id: "j1",
                date: "28/07/2026",
                title: "Morning Wakeboard Run",
                time: "10:15 AM - 11:45 AM",
                duration: "1h 30m",
                distance: "14.2 km",
                fuelUsed: 18.5,
                path: SAMPLE_LOUGH_ERNE_TRACK.slice(0, 10)
            },
            {
                id: "j2",
                date: "28/07/2026",
                title: "Afternoon Lough Cruise",
                time: "02:30 PM - 04:10 PM",
                duration: "1h 40m",
                distance: "18.6 km",
                fuelUsed: 22.1,
                path: SAMPLE_LOUGH_ERNE_TRACK.slice(8, 20)
            },
            {
                id: "j3",
                date: "27/07/2026",
                title: "Devenish Island Excursion",
                time: "01:00 PM - 03:20 PM",
                duration: "2h 20m",
                distance: "24.0 km",
                fuelUsed: 28.4,
                path: SAMPLE_LOUGH_ERNE_TRACK.slice(4, 16)
            }
        ];

        const SAMPLE_TELEMETRY = {
            fuel_liters: 58.4,
            fuel_percent: 73.0,
            engine_rpm: 3250,
            throttle_percent: 45,
            run_time_seconds: 4320,
            runtime: "01:12",
            coolant_temp: 78.5,
            oil_pressure: 310.0,
            battery_volt: 13.85,
            engine_hours: 246.50,
            intake_temp: 22.0,
            fuel_rate: 24.50,
            j1939_fuel_level: 72.8,
            zo_handshake: "System Ready",
            security_heart: "AUTH ACTIVE",
            zo_speed: 22.4,
            gps_speed: 22.0,
            gps_valid: true,
            gps_lat: 54.3882,
            gps_lng: -7.7011
        };

        const GAUGE_REGISTRY = {
            "fuel_mgmt":        { name: "Fuel Level",       unit: " L",    hasProgress: true,  isDefault: true },
            "engine_rpm":       { name: "Engine Speed",   unit: " RPM",  hasProgress: true,  isDefault: true },
            "throttle_percent": { name: "Throttle",       unit: "%",     hasProgress: true,  isDefault: true },
            "run_time_seconds": { name: "Run Time",       unit: "",      hasProgress: false, isDefault: true },
            "coolant_temp":     { name: "Coolant Temp",   unit: " °C",   hasProgress: false, isDefault: false },
            "oil_pressure":     { name: "Engine Oil Press",unit: " kPa",  hasProgress: false, isDefault: false },
            "battery_volt":     { name: "Battery Voltage",unit: " V",    hasProgress: false, isDefault: false },
            "engine_hours":     { name: "Engine Hours",   unit: " hrs",  hasProgress: false, isDefault: false },
            "intake_temp":      { name: "Intake Air Temp",unit: " °C",   hasProgress: false, isDefault: false },
            "fuel_rate":        { name: "Fuel Rate",      unit: " L/h",  hasProgress: false, isDefault: false },
            "j1939_fuel_level": { name: "Fuel Level (J)", unit: " %",    hasProgress: true,  isDefault: false },
            "zo_handshake":     { name: "ZeroOff Sync",   unit: "",      hasProgress: false, isDefault: false },
            "security_heart":   { name: "Security Auth",  unit: "",      hasProgress: false, isDefault: false },
            "zo_speed":         { name: "ZeroOff SOG",    unit: " mph",  hasProgress: false, isDefault: false }
        };

        let activeLayout = [];
        let isEditing = false;
        const circumference = 2 * Math.PI * 90;
        let map, routePolyline, boatMarker;
        const miniMaps = {};

        // --- MAP FIX: Reliable HTTPS OpenStreetMap with Inversion Filter ---
        function initMapWithSampleData() {
            map = L.map('map').setView([54.385, -7.700], 12);

            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                className: 'dark-tiles',
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            routePolyline = L.polyline(SAMPLE_LOUGH_ERNE_TRACK, {
                color: '#ff5500',
                weight: 5,
                opacity: 0.9,
                lineJoin: 'round'
            }).addTo(map);

            map.fitBounds(routePolyline.getBounds(), { padding: [20, 20] });

            const currentPosition = SAMPLE_LOUGH_ERNE_TRACK[7];
            boatMarker = L.circleMarker(currentPosition, {
                color: '#ffffff',
                fillColor: '#ff5500',
                fillOpacity: 1,
                radius: 8,
                weight: 3
            }).addTo(map).bindPopup("<b>Nelly the Nautique</b><br>Speed: 22 MPH<br>Lough Erne Track").openPopup();

            // Force recalculation to prevent blank canvas bug on GitHub Pages
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        // --- JOURNEY LOGS AGGREGATED BY DAY ---
        function renderJourneyLogs() {
            const container = document.getElementById('journey-logs-container');
            container.innerHTML = '';

            // Group journeys by date
            const grouped = {};
            SAMPLE_JOURNEY_LOGS.forEach(j => {
                if (!grouped[j.date]) grouped[j.date] = [];
                grouped[j.date].push(j);
            });

            // Render Daily Cards
            Object.keys(grouped).forEach((dateStr, dayIndex) => {
                const dayJourneys = grouped[dateStr];
                const totalFuel = dayJourneys.reduce((sum, item) => sum + item.fuelUsed, 0).toFixed(1);
                const dayCardId = `day-card-${dayIndex}`;

                const card = document.createElement('div');
                card.className = 'day-log-card';
                card.id = dayCardId;

                card.innerHTML = `
                    <div class="day-log-header" onclick="toggleDayLog('${dayCardId}')">
                        <div>
                            <div class="day-title">${dateStr}</div>
                            <div class="day-summary">${dayJourneys.length} Journey${dayJourneys.length > 1 ? 's' : ''} • Total Fuel: <span class="day-total-fuel">${totalFuel} L</span></div>
                        </div>
                        <div class="toggle-arrow">▼</div>
                    </div>
                    <div class="day-log-details">
                        ${dayJourneys.map(j => `
                            <div class="sub-journey-item">
                                <div class="sub-journey-header">
                                    <span>${j.title}</span>
                                    <span style="color: var(--nautique-orange);">${j.fuelUsed} L</span>
                                </div>
                                <div class="sub-journey-stats">
                                    <div>Time: <span>${j.time}</span></div>
                                    <div>Dist: <span>${j.distance}</span></div>
                                    <div>Dur: <span>${j.duration}</span></div>
                                </div>
                                <div id="minimap-${j.id}" class="mini-map"></div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleDayLog(cardId) {
            const card = document.getElementById(cardId);
            const isOpen = card.classList.contains('open');
            
            if (isOpen) {
                card.classList.remove('open');
            } else {
                card.classList.add('open');
                
                // Initialize Leaflet Mini-Maps on first expand
                setTimeout(() => {
                    const dayIndex = cardId.replace('day-card-', '');
                    const dateStr = Object.keys(SAMPLE_JOURNEY_LOGS.reduce((acc, j) => { acc[j.date] = true; return acc; }, {}))[dayIndex];
                    const dayJourneys = SAMPLE_JOURNEY_LOGS.filter(j => j.date === dateStr);

                    dayJourneys.forEach(j => {
                        const miniMapId = `minimap-${j.id}`;
                        if (!miniMaps[miniMapId]) {
                            const miniMap = L.map(miniMapId, {
                                zoomControl: false,
                                dragging: false,
                                scrollWheelZoom: false,
                                doubleClickZoom: false
                            });

                            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                className: 'dark-tiles',
                                attribution: ''
                            }).addTo(miniMap);

                            const polyline = L.polyline(j.path, {
                                color: '#ff5500',
                                weight: 4,
                                opacity: 0.9
                            }).addTo(miniMap);

                            miniMap.fitBounds(polyline.getBounds(), { padding: [10, 10] });
                            miniMaps[miniMapId] = miniMap;
                        }
                        miniMaps[miniMapId].invalidateSize();
                    });
                }, 150);
            }
        }

        function initLayoutConfig() {
            let stored = localStorage.getItem('nautique_layout_v2');
            if (stored) {
                activeLayout = JSON.parse(stored);
            } else {
                activeLayout = Object.keys(GAUGE_REGISTRY).filter(k => GAUGE_REGISTRY[k].isDefault);
                saveLayoutConfig();
            }
        }

        function saveLayoutConfig() {
            localStorage.setItem('nautique_layout_v2', JSON.stringify(activeLayout));
        }

        function renderGaugeGrid() {
            const grid = document.getElementById('telemetry-grid');
            grid.innerHTML = '';

            activeLayout.forEach(key => {
                const meta = GAUGE_REGISTRY[key];
                if (!meta) return;

                const card = document.createElement('div');
                card.className = 'gauge-card';
                card.setAttribute('draggable', isEditing ? 'true' : 'false');
                card.setAttribute('data-key', key);

                let progressHtml = meta.hasProgress ? `
                    <div class="progress-track" style="margin-top:6px;">
                        <div id="pb-${key}" class="progress-bar" style="width: 0%"></div>
                    </div>` : '';

                let subLabel = "Telemetry Data";
                if(key === 'fuel_mgmt') subLabel = "-- / 80 L";
                if(key === 'engine_rpm') subLabel = "Tachometer";
                if(key === 'throttle_percent') subLabel = "Position Index";
                if(key === 'run_time_seconds') subLabel = "Active Hours";

                card.innerHTML = `
                    <div class="card-label">${meta.name}</div>
                    <div id="val-${key}" class="card-val">--</div>
                    <div id="sub-${key}" style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px;">${subLabel}</div>
                    ${progressHtml}
                    <button class="card-delete-btn" onclick="deleteGaugeNode(event, '${key}')">Delete</button>
                `;
                grid.appendChild(card);
            });

            const selector = document.getElementById('gauge-selector');
            selector.innerHTML = '';
            Object.keys(GAUGE_REGISTRY).forEach(key => {
                if (!activeLayout.includes(key)) {
                    selector.innerHTML += `<option value="${key}">${GAUGE_REGISTRY[key].name}</option>`;
                }
            });
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            const btn = document.getElementById('edit-layout-btn');
            const grid = document.getElementById('telemetry-grid');
            const addPanel = document.getElementById('add-item-box');

            if (isEditing) {
                btn.innerText = "Done";
                btn.classList.add('active');
                grid.classList.add('edit-mode');
                addPanel.style.display = 'block';
            } else {
                btn.innerText = "Edit";
                btn.classList.remove('active');
                grid.classList.remove('edit-mode');
                addPanel.style.display = 'none';
                saveLayoutConfig();
            }
        }

        function addGaugeNode() {
            const selector = document.getElementById('gauge-selector');
            if (selector.value) {
                activeLayout.push(selector.value);
                renderGaugeGrid();
                saveLayoutConfig();
                updateDashboardWithSampleData();
            }
        }

        function deleteGaugeNode(e, key) {
            e.stopPropagation();
            activeLayout = activeLayout.filter(k => k !== key);
            renderGaugeGrid();
            saveLayoutConfig();
            updateDashboardWithSampleData();
        }

        function updateDashboardWithSampleData() {
            const data = SAMPLE_TELEMETRY;

            const speedValEl = document.getElementById('speed-val');
            const speedRing = document.getElementById('speed-ring');
            speedValEl.innerText = Math.round(data.gps_speed);
            let speedPercent = Math.min(data.gps_speed / 50, 1);
            speedRing.style.strokeDashoffset = circumference - (speedPercent * circumference);

            activeLayout.forEach(key => {
                const valEl = document.getElementById(`val-${key}`);
                const pbEl = document.getElementById(`pb-${key}`);
                const subEl = document.getElementById(`sub-${key}`);
                if (!valEl) return;

                let value = data[key];
                let unit = GAUGE_REGISTRY[key].unit;

                if (key === 'fuel_mgmt') {
                    valEl.innerText = data.fuel_percent + '%';
                    if(subEl) subEl.innerText = data.fuel_liters + ' / 80 L';
                    if(pbEl) pbEl.style.width = data.fuel_percent + '%';
                } else if (key === 'run_time_seconds') {
                    valEl.innerText = data.runtime;
                } else {
                    valEl.innerText = value + unit;
                    if (pbEl) {
                        let pct = 0;
                        if (key === 'engine_rpm') pct = Math.min((value / 6000) * 100, 100);
                        else if (key === 'throttle_percent' || key === 'j1939_fuel_level') pct = value;
                        pbEl.style.width = pct + '%';
                    }
                }
            });
        }

        async function toggleBluetoothConnection() {
            alert("This preview is currently demonstrating sample Lough Erne trip telemetry.");
        }

        function sendRefillCommand() {
            const input = document.getElementById('refill-input');
            const liters = parseFloat(input.value);

            if (isNaN(liters) || liters <= 0) {
                alert("Please enter a valid number of liters.");
                return;
            }
            alert(`[Sample Mode] Refill logged: ${liters} L added.`);
            input.value = '';
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMapWithSampleData();
            initLayoutConfig();
            renderGaugeGrid();
            renderJourneyLogs();
            updateDashboardWithSampleData();
        });
    </script>
</body>
</html>
