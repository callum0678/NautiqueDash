<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly the Nautique Dashboard</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(22, 24, 30, 0.95);
            --card-bg: #1c1e24;
            --nautique-orange: #ff5500;
            --orange-glow: rgba(255, 85, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --danger-red: #ff3b30;
            --connected-green: #00ff66;
        }

        body { 
            font-family: 'Inter', Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 15px; 
            margin: 0;
            background-image: radial-gradient(circle at top, #1e1b18 0%, var(--bg-color) 70%);
            touch-action: manipulation;
        }

        .dashboard { 
            max-width: 480px; 
            margin: 10px auto; 
            background: var(--panel-bg); 
            padding: 25px 20px; 
            border-radius: 32px; 
            border: 1px solid rgba(255, 85, 0, 0.2); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 85, 0, 0.05);
            backdrop-filter: blur(10px);
            position: relative;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem; 
            margin: 0 0 2px 0; 
            font-weight: 900; 
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { 
            color: var(--nautique-orange); 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 800; 
            margin-bottom: 8px; 
            text-shadow: 0 0 10px var(--orange-glow);
        }

        .last-updated-header {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .bt-connection-bar {
            margin-bottom: 20px;
        }

        .btn-connect {
            background: linear-gradient(135deg, #ff5500 0%, #d44400 100%);
            color: #ffffff;
            width: 100%;
            padding: 12px;
            font-size: 0.85rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.3);
            border: none;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .speed-gauge-container {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto 25px auto;
        }

        .speed-svg { transform: rotate(-90deg); }
        .speed-track { fill: none; stroke: #17191f; stroke-width: 14; }
        .speed-bar {
            fill: none;
            stroke: var(--nautique-orange);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 565.48;
            stroke-dashoffset: 565.48;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 8px var(--nautique-orange));
        }

        .speed-text-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .speed-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
            color: #ffffff;
        }

        .speed-unit {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        #map-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 10px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 85, 0, 0.2);
            text-align: left;
        }

        #map-title {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            margin-bottom: 8px;
            padding-left: 5px;
        }

        #map {
            width: 100%;
            height: 240px;
            border-radius: 14px;
            background: #121317;
            z-index: 1;
        }

        /* Dark Mode CSS Filter for reliable OpenStreetMap tiles */
        .dark-tiles {
            filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7);
        }

        .grid-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 25px 0 10px 0;
            padding: 0 5px;
        }

        .section-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .btn-edit {
            background: var(--nautique-orange);
            color: #ffffff;
            font-size: 0.75rem;
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 85, 0, 0.2);
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            margin-bottom: 25px;
        }

        .gauge-card { 
            background: var(--card-bg); 
            padding: 16px 12px; 
            border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.03);
            text-align: left;
            position: relative;
        }

        .card-label { 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-val { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem; 
            font-weight: 700; 
            color: var(--text-main); 
            margin-bottom: 8px;
        }

        .progress-track {
            width: 100%;
            height: 5px;
            background: #121317;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--nautique-orange);
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 6px var(--nautique-orange);
            transition: width 0.3s ease;
        }

        #gps-status {
            font-size: 0.7rem;
            color: #00ff66;
            margin-top: -10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Nelly the Nautique</h1>
        <div class="subtitle">Multi-Telemetry Hub</div>
        <div class="last-updated-header">Last updated at 12:32 28/07/2026</div>

        <div class="bt-connection-bar">
            <button class="btn-connect" onclick="alert('Demo Mode Active')">Pair Bluetooth Device</button>
        </div>
        
        <div id="gps-status">GPS: LOCKED (GARMIN)</div>

        <div class="speed-gauge-container">
            <svg class="speed-svg" width="220" height="220">
                <circle class="speed-track" cx="110" cy="110" r="90"></circle>
                <circle id="speed-ring" class="speed-bar" cx="110" cy="110" r="90"></circle>
            </svg>
            <div class="speed-text-container">
                <span id="speed-val" class="speed-value">22</span>
                <span class="speed-unit">MPH</span>
            </div>
        </div>

        <!-- Map Section -->
        <div id="map-card">
            <div id="map-title">Journey Map & GPS Track (Lough Erne)</div>
            <div id="map"></div>
        </div>

        <div class="grid-header-row">
            <div class="section-label">Instruments</div>
        </div>

        <div class="grid-container" id="telemetry-grid"></div>
    </div>

    <script>
        // --- LOUGH ERNE GPS SAMPLE PATH ---
        const SAMPLE_LOUGH_ERNE_TRACK = [
            [54.3481, -7.6410],
            [54.3512, -7.6452],
            [54.3565, -7.6521],
            [54.3620, -7.6605],
            [54.3685, -7.6710],
            [54.3742, -7.6802],
            [54.3810, -7.6895],
            [54.3882, -7.7011],
            [54.3945, -7.7120],
            [54.3998, -7.7245],
            [54.4051, -7.7380]
        ];

        let map, routePolyline, boatMarker;

        function initMap() {
            // Set initial coordinates on Lough Erne
            map = L.map('map').setView([54.3742, -7.6802], 12);

            // Use direct OpenStreetMap HTTPS tiles with dark mode class
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                className: 'dark-tiles',
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // Draw Journey Polyline
            routePolyline = L.polyline(SAMPLE_LOUGH_ERNE_TRACK, {
                color: '#ff5500',
                weight: 5,
                opacity: 0.95
            }).addTo(map);

            // Fit boundaries
            map.fitBounds(routePolyline.getBounds(), { padding: [20, 20] });

            // Add Boat Location Pin
            boatMarker = L.circleMarker([54.3882, -7.7011], {
                color: '#ffffff',
                fillColor: '#ff5500',
                fillOpacity: 1,
                radius: 8,
                weight: 3
            }).addTo(map).bindPopup("<b>Nelly the Nautique</b><br>Cruising Lough Erne").openPopup();

            // Force Leaflet recalculation to prevent blank map issue on GitHub Pages
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }

        function renderSampleGauges() {
            const grid = document.getElementById('telemetry-grid');
            const data = [
                { label: "Fuel Level", val: "73%", sub: "58.4 / 80 L", pct: 73 },
                { label: "Engine Speed", val: "3250 RPM", sub: "Tachometer", pct: 54 },
                { label: "Throttle", val: "45%", sub: "Position Index", pct: 45 },
                { label: "Coolant Temp", val: "78.5 °C", sub: "Engine Temp", pct: 0 }
            ];

            grid.innerHTML = data.map(item => `
                <div class="gauge-card">
                    <div class="card-label">${item.label}</div>
                    <div class="card-val">${item.val}</div>
                    <div style="font-size:0.72rem; color:var(--text-muted);">${item.sub}</div>
                    ${item.pct > 0 ? `<div class="progress-track" style="margin-top:6px;"><div class="progress-bar" style="width:${item.pct}%"></div></div>` : ''}
                </div>
            `).join('');

            // Speedometer Arc
            const speedRing = document.getElementById('speed-ring');
            const circumference = 2 * Math.PI * 90;
            const pct = 22 / 50;
            speedRing.style.strokeDashoffset = circumference - (pct * circumference);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            renderSampleGauges();
        });
    </script>
</body>
</html>
