<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nelly the Nautique - Lough Erne Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(22, 24, 30, 0.95);
            --card-bg: #1c1e24;
            --nautique-orange: #ff5500;
            --orange-glow: rgba(255, 85, 0, 0.35);
            --text-main: #ffffff;
            --text-muted: #7e8494;
            --danger-red: #ff3b30;
            --connected-green: #00ff66;
            --sync-blue: #0099ff;
        }

        body { 
            font-family: 'Inter', Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            text-align: center; 
            padding: 15px; 
            margin: 0;
            background-image: radial-gradient(circle at top, #1e1b18 0%, var(--bg-color) 70%);
            touch-action: manipulation;
        }

        .dashboard { 
            max-width: 480px; 
            margin: 10px auto; 
            background: var(--panel-bg); 
            padding: 25px 20px; 
            border-radius: 32px; 
            border: 1px solid rgba(255, 85, 0, 0.2); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: relative;
        }

        h1 { 
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem; 
            margin: 0 0 2px 0; 
            font-weight: 900; 
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #fff 0%, #a0a0a0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle { color: var(--nautique-orange); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px; font-weight: 800; margin-bottom: 8px; }
        .last-updated-header { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 15px; text-transform: uppercase; font-weight: 600; }
        .bt-connection-bar { margin-bottom: 12px; }

        .btn-connect {
            background: linear-gradient(135deg, #ff5500 0%, #d44400 100%);
            color: #ffffff; width: 100%; padding: 12px; font-size: 0.85rem;
            border-radius: 12px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase;
        }
        .btn-connect.connected { background: #1c1e24; color: var(--connected-green); border: 1px solid var(--connected-green); }

        #sync-banner {
            display: none; font-size: 0.72rem; color: var(--sync-blue);
            background: rgba(0, 153, 255, 0.1); border: 1px solid var(--sync-blue);
            border-radius: 8px; padding: 6px; margin-bottom: 12px; text-transform: uppercase; font-weight: 800;
        }

        .speed-gauge-container { position: relative; width: 220px; height: 220px; margin: 0 auto 20px auto; }
        .speed-svg { transform: rotate(-90deg); }
        .speed-track { fill: none; stroke: #17191f; stroke-width: 14; }
        .speed-bar {
            fill: none; stroke: var(--nautique-orange); stroke-width: 14; stroke-linecap: round;
            stroke-dasharray: 565.48; stroke-dashoffset: 565.48; transition: stroke-dashoffset 0.3s ease;
        }
        .speed-text-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
        .speed-value { font-family: 'Orbitron', sans-serif; font-size: 4.5rem; font-weight: 900; line-height: 1; color: #ffffff; }
        .speed-unit { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        #map-card { background: var(--card-bg); border-radius: 20px; padding: 10px; margin-bottom: 25px; border: 1px solid rgba(255, 85, 0, 0.2); text-align: left; }
        #map-title { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; margin-bottom: 8px; padding-left: 5px; }
        #map { width: 100%; height: 240px; border-radius: 14px; background: #121317; z-index: 1; }
        .dark-tiles { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }

        .grid-header-row { display: flex; justify-content: space-between; align-items: center; margin: 25px 0 10px 0; padding: 0 5px; }
        .section-label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; }
        .btn-edit { background: var(--nautique-orange); color: #ffffff; font-size: 0.75rem; padding: 6px 14px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; }
        .btn-edit.active { background: #ffffff; color: var(--bg-color); }

        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; min-height: 50px; }
        .gauge-card { background: var(--card-bg); padding: 16px 12px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.03); text-align: left; position: relative; }
        .card-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 8px; }
        .card-val { font-family: 'Orbitron', sans-serif; font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        
        .progress-track { width: 100%; height: 5px; background: #121317; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--nautique-orange); width: 0%; border-radius: 3px; transition: width 0.3s ease; }

        .add-item-panel { display: none; background: #121317; border: 1px solid rgba(255,255,255,0.05); border-radius: 18px; padding: 15px; margin-bottom: 25px; text-align: left; }
        .add-item-panel select { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid #2c2f36; color: white; border-radius: 10px; margin-bottom: 10px; outline: none; }

        .control-panel { margin-top: 25px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); text-align: left; }
        .flex-group { display: flex; justify-content: space-between; margin-top: 10px; gap: 10px; align-items: center; }
        input[type="number"] { padding: 14px; font-size: 1rem; flex-grow: 1; border-radius: 14px; border: 1px solid #2c2f36; background: #121317; color: #ffffff; text-align: center; outline: none; }
        button { padding: 14px 20px; font-size: 0.95rem; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-orange { background: var(--nautique-orange); color: #ffffff; }
        
        #gps-status { font-size: 0.7rem; color: var(--text-muted); margin-top: -5px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }
        .journey-logs-section { margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: left; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>Nelly the Nautique</h1>
        <div class="subtitle">Lough Erne Telemetry Hub</div>
        <div class="last-updated-header" id="last-updated-text">Last updated: --</div>

        <div class="bt-connection-bar">
            <button id="bt-btn" class="btn-connect" onclick="toggleBluetoothConnection()">Pair Bluetooth Device</button>
        </div>
        
        <div id="sync-banner">Syncing Offline Flash Logs...</div>
        <div id="gps-status">GPS: DISCONNECTED</div>

        <div class="speed-gauge-container">
            <svg class="speed-svg" width="220" height="220">
                <circle class="speed-track" cx="110" cy="110" r="90"></circle>
                <circle id="speed-ring" class="speed-bar" cx="110" cy="110" r="90"></circle>
            </svg>
            <div class="speed-text-container">
                <span id="speed-val" class="speed-value">0</span>
                <span class="speed-unit">MPH</span>
            </div>
        </div>

        <div class="grid-header-row">
            <div class="section-label">Instruments</div>
            <button class="btn-edit" id="edit-layout-btn" onclick="toggleEditMode()">Edit</button>
        </div>

        <div class="add-item-panel" id="add-item-box">
            <div class="card-label">Add Instrument Option</div>
            <select id="gauge-selector"></select>
            <button class="btn-orange" style="padding: 10px; font-size:0.8rem; width:100%;" onclick="addGaugeNode()">Insert Into Grid</button>
        </div>

        <div class="grid-container" id="telemetry-grid"></div>

        <div id="map-card">
            <div id="map-title">Lough Erne Journey Map & Track</div>
            <div id="map"></div>
        </div>

        <div class="control-panel">
            <div class="card-label" style="padding-left:4px;">Log Top-Off Fuel (Liters)</div>
            <div class="flex-group">
                <input type="number" id="refill-input" step="0.1" placeholder="Liters on receipt">
                <button type="button" class="btn-orange" onclick="sendRefillCommand()">Reset Full</button>
            </div>
        </div>

        <div class="journey-logs-section">
            <div class="section-label" style="margin-bottom: 12px;">Daily Journey Logs</div>
            <div id="journey-logs-container">
                <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 15px;">Loading journey records...</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://cgssprxbklhkoscvclux.supabase.co/";       
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnc3Nwcnhia2xoa29zY3ZjbHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTYyNzMsImV4cCI6MjEwMDgzMjI3M30.Bua2rEmjUkW-ZUJjAOyxFk95dXgQFxJNMG5CwbDffdc";  
        
        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_URL) {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const GAUGE_REGISTRY = {
            "fl": { name: "Fuel Level", unit: " L", hasProgress: true, isDefault: true },
            "rpm": { name: "Engine Speed", unit: " RPM", hasProgress: true, isDefault: true },
            "thr": { name: "Throttle", unit: "%", hasProgress: true, isDefault: true },
            "run": { name: "Run Time", unit: "", hasProgress: false, isDefault: true },
            "ct": { name: "Coolant Temp", unit: " °C", hasProgress: false, isDefault: false },
            "op": { name: "Engine Oil Press", unit: " kPa", hasProgress: false, isDefault: false },
            "bv": { name: "Battery Voltage", unit: " V", hasProgress: false, isDefault: false },
            "eh": { name: "Engine Hours", unit: " hrs", hasProgress: false, isDefault: false },
            "fr": { name: "Fuel Rate", unit: " L/h", hasProgress: false, isDefault: false }
        };

        let activeLayout = [];
        let isEditing = false;
        const circumference = 2 * Math.PI * 90;

        const SERVICE_UUID           = "6E400001-B5A3-F393-E0A9-E50E24DCCA9E";
        const CHARACTERISTIC_UUID_RX = "6E400002-B5A3-F393-E0A9-E50E24DCCA9E";
        const CHARACTERISTIC_UUID_TX = "6E400003-B5A3-F393-E0A9-E50E24DCCA9E";
        
        let bleDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;
        let isConnected = false;
        let receiveBuffer = "";
        let lastPacketReceivedTime = 0;

        let map, routePolyline, boatMarker;
        let routeCoordinates = [];

        function initMap() {
            map = L.map('map').setView([54.3711, -7.6580], 12);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, className: 'dark-tiles', attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            routePolyline = L.polyline([], { color: '#ff5500', weight: 5, opacity: 0.9 }).addTo(map);
            setTimeout(() => { map.invalidateSize(); }, 300);
        }

        async function toggleBluetoothConnection() {
            if (isConnected) disconnectBLE();
            else connectBLE();
        }

        async function connectBLE() {
            const btBtn = document.getElementById('bt-btn');
            try {
                if (!('bluetooth' in navigator)) { alert('Web Bluetooth not supported.'); return; }
                btBtn.innerText = "Connecting...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Nautique-Telemetry' }, { namePrefix: 'Nautique' }],
                    optionalServices: [SERVICE_UUID]
                });
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);

                rxCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_RX);
                txCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID_TX);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleBLEData);

                isConnected = true;
                btBtn.innerText = "Connected (BLE)";
                btBtn.classList.add('connected');
                
                // Request log sync
                rxCharacteristic.writeValue(new TextEncoder().encode("SYNC\n"));
            } catch (error) {
                console.error("BLE Error:", error);
                btBtn.innerText = "Pair Bluetooth Device";
                isConnected = false;
            }
        }

        function disconnectBLE() {
            if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect();
            onDisconnected();
        }

        function onDisconnected() {
            isConnected = false;
            document.getElementById('bt-btn').innerText = "Pair Bluetooth Device";
            document.getElementById('bt-btn').classList.remove('connected');
            document.getElementById('sync-banner').style.display = 'none';
        }

        function handleBLEData(event) {
            lastPacketReceivedTime = Date.now();
            let chunk = new TextDecoder('utf-8').decode(event.target.value);
            receiveBuffer += chunk;
            let lines = receiveBuffer.split('\n');
            receiveBuffer = lines.pop();

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('{') && line.endsWith('}')) {
                    try {
                        const data = JSON.parse(line);
                        if (data.type === "SYNC_START") {
                            document.getElementById('sync-banner').style.display = 'block';
                        } else if (data.type === "SYNC_END") {
                            document.getElementById('sync-banner').style.display = 'none';
                        } else {
                            updateDashboard(data);
                        }
                    } catch (e) {}
                }
            });
            updateLastUpdatedTimestamp(new Date());
        }

        // Periodic watchdog loop to clear stale status banners if stream pauses
        setInterval(() => {
            if (isConnected && lastPacketReceivedTime > 0 && (Date.now() - lastPacketReceivedTime > 5000)) {
                document.getElementById('sync-banner').style.display = 'none';
            }
        }, 2000);

        function updateDashboard(data) {
            const gpsStatus = document.getElementById('gps-status');

            if (data.gv) {
                gpsStatus.innerText = "GPS: LOCKED";
                gpsStatus.style.color = "#00ff66";
                updateSpeedometer(data.gs || 0);
            } else {
                gpsStatus.innerText = "GPS: SEARCHING...";
                gpsStatus.style.color = "#ff8800";
                updateSpeedometer(0);
            }

            if (data.lat && data.lng) {
                updateLiveMap(data.lat, data.lng);
            }

            activeLayout.forEach(key => {
                if (key === 'fl' && data.fl !== undefined) {
                    const pct = data.fp || Math.min(100, (data.fl / 80.0) * 100);
                    updateGaugeValue('fl', `${pct.toFixed(0)}%`, `${pct}%`);
                } else if (key === 'rpm' && data.rpm !== undefined) {
                    updateGaugeValue('rpm', data.rpm, `${Math.min(100, (data.rpm / 6000) * 100)}%`);
                } else if (key === 'thr' && data.thr !== undefined) {
                    updateGaugeValue('thr', data.thr, `${data.thr}%`);
                } else if (key === 'run' && data.run !== undefined) {
                    updateGaugeValue('run', data.run);
                } else if (data[key] !== undefined) {
                    updateGaugeValue(key, data[key]);
                }
            });
        }

        function updateSpeedometer(speedMph) {
            document.getElementById('speed-val').innerText = Math.round(speedMph);
            let speedPercent = Math.min(1, Math.max(0, speedMph / 50));
            document.getElementById('speed-ring').style.strokeDashoffset = circumference - (speedPercent * circumference);
        }

        function updateGaugeValue(key, value, progressWidth = null) {
            const valEl = document.getElementById(`val-${key}`);
            const pbEl = document.getElementById(`pb-${key}`);
            if (valEl) valEl.innerText = value + (GAUGE_REGISTRY[key] ? GAUGE_REGISTRY[key].unit : '');
            if (pbEl && progressWidth) pbEl.style.width = progressWidth;
        }

        function updateLiveMap(lat, lng) {
            const latLng = [lat, lng];
            routeCoordinates.push(latLng);
            routePolyline.setLatLngs(routeCoordinates);
            if (boatMarker) boatMarker.setLatLng(latLng);
            else boatMarker = L.circleMarker(latLng, { color: '#ff5500', fillColor: '#ff5500', fillOpacity: 1, radius: 8 }).addTo(map);
            map.panTo(latLng);
        }

        async function sendRefillCommand() {
            const liters = parseFloat(document.getElementById('refill-input').value);
            if (isNaN(liters) || liters <= 0) { alert("Enter valid liters."); return; }
            if (isConnected && rxCharacteristic) {
                await rxCharacteristic.writeValue(new TextEncoder().encode(`REFILL:${liters}\n`));
                alert(`Refill Sent: ${liters}L`);
            }
        }

        function updateLastUpdatedTimestamp(dateObj) {
            const timeStr = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('last-updated-text').innerText = `Last updated at ${timeStr}`;
        }

        function initLayoutConfig() {
            let stored = localStorage.getItem('nautique_layout_v3');
            if (stored) { try { activeLayout = JSON.parse(stored); } catch(e) {} }
            if (!activeLayout || activeLayout.length === 0) {
                activeLayout = Object.keys(GAUGE_REGISTRY).filter(k => GAUGE_REGISTRY[k].isDefault);
                localStorage.setItem('nautique_layout_v3', JSON.stringify(activeLayout));
            }
        }

        function renderGaugeGrid() {
            const grid = document.getElementById('telemetry-grid');
            grid.innerHTML = '';
            activeLayout.forEach(key => {
                const meta = GAUGE_REGISTRY[key];
                if (!meta) return;
                const card = document.createElement('div');
                card.className = 'gauge-card';
                card.innerHTML = `
                    <div class="card-label">${meta.name}</div>
                    <div id="val-${key}" class="card-val">--</div>
                    ${meta.hasProgress ? `<div class="progress-track"><div id="pb-${key}" class="progress-bar" style="width: 0%"></div></div>` : ''}
                    <button style="display:none; position:absolute; bottom:8px; right:8px; background:red; color:white; border:none; border-radius:4px; padding:2px 6px;" onclick="activeLayout=activeLayout.filter(k=>k!='${key}');renderGaugeGrid();localStorage.setItem('nautique_layout_v3',JSON.stringify(activeLayout));">Del</button>
                `;
                grid.appendChild(card);
            });
            const selector = document.getElementById('gauge-selector');
            selector.innerHTML = '';
            Object.keys(GAUGE_REGISTRY).forEach(key => {
                if (!activeLayout.includes(key)) selector.innerHTML += `<option value="${key}">${GAUGE_REGISTRY[key].name}</option>`;
            });
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            document.getElementById('edit-layout-btn').innerText = isEditing ? "Done" : "Edit";
            document.getElementById('edit-layout-btn').classList.toggle('active', isEditing);
            document.getElementById('add-item-box').style.display = isEditing ? 'block' : 'none';
        }

        function addGaugeNode() {
            const val = document.getElementById('gauge-selector').value;
            if (val) { activeLayout.push(val); renderGaugeGrid(); localStorage.setItem('nautique_layout_v3', JSON.stringify(activeLayout)); }
        }

        window.addEventListener('DOMContentLoaded', () => { initMap(); initLayoutConfig(); renderGaugeGrid(); });
    </script>
</body>
</html>
